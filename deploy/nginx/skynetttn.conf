# Nginx: sirve el build estático del frontend y hace de proxy reverso hacia
# el Backend (PM2, puerto 3001) para /api y /storage.
#
# Instalación en el VPS:
#   sudo cp deploy/nginx/skynetttn.conf /etc/nginx/sites-available/skynetttn.conf
#   sudo ln -s /etc/nginx/sites-available/skynetttn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d skynetttn.online -d www.skynetttn.online
# (certbot reescribe este archivo agregando el bloque 443/SSL automáticamente)

server {
    listen 80;
    listen [::]:80;
    server_name skynetttn.online www.skynetttn.online;

    # Build de producción del frontend (vite build → frontend/dist).
    # Ruta real en el VPS: repo bajo el usuario `prueba`, NO /var/www (eso es
    # de otro proyecto en este mismo servidor compartido — ver docs/despliegue).
    root /home/prueba/skynet/frontend/dist;
    index index.html;

    # Gzip para el bundle JS/CSS servido como estático.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre (Vite): cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker y manifest de la PWA: nunca cachear, si no los clientes
    # tardan en recibir actualizaciones del SW.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # index.html referencia los bundles con hash del build actual (ver
    # /assets/ arriba): si el navegador lo cachea sin revalidar, un usuario
    # puede quedarse con un index.html que apunta a archivos que el
    # siguiente `npm run build` ya borró (pantalla en blanco) hasta que
    # fuerce un Ctrl+Shift+R. no-cache obliga a revalidar con el servidor
    # en cada carga (sigue siendo rápido: es un 304 si no cambió).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API del backend (Express en PM2, localhost:3001).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos servidos por el backend (PDFs legados, fotos que no van a Cloudinary).
    location /storage/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
    }

    # Actualizaciones de la app de escritorio (escritorio/src/actualizador.js).
    #
    # La app instalada en cada equipo pide latest.yml cada 6 horas; si dentro
    # hay una versión mayor que la suya, se descarga el .exe de esta misma
    # carpeta. Es el mismo mecanismo de electron-updater que usan VS Code o
    # Slack, servido desde aquí para no depender de GitHub ni de terceros.
    #
    # Los archivos NO viven dentro del repo, a propósito: un `git pull` o un
    # `npm run build` no deben poder borrar el instalador que los equipos están
    # descargando. Crear la carpeta una vez en el VPS:
    #   mkdir -p /home/prueba/skynet-descargas
    # `^~` para que gane a cualquier location con expresión regular y no se
    # cuele en el try_files de la SPA: un instalador que no existe debe dar 404,
    # no devolver el index.html de React (electron-updater intentaría parsear
    # HTML como YAML y el error sería incomprensible).
    location ^~ /descargas/ {
        alias /home/prueba/skynet-descargas/;

        # no-cache en TODA la carpeta, incluidos los .exe. Podrían cachearse
        # eternamente porque llevan la versión en el nombre, pero el archivo que
        # de verdad importa es latest.yml: si un proxy intermedio lo guarda, los
        # equipos siguen viendo la versión vieja horas después de publicar una
        # corrección. No merece la pena arriesgar eso para ahorrar un 304 en un
        # archivo que cada equipo baja una sola vez por versión.
        add_header Cache-Control "no-cache";

        # Sin índice de directorio: cada archivo se pide por su nombre exacto,
        # que el propio latest.yml indica.
        autoindex off;
    }

    # SPA: cualquier ruta que no sea archivo real cae en index.html
    # (React Router maneja el resto en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
