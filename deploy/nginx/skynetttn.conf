# Nginx: sirve el build estático del frontend y hace de proxy reverso hacia
# el Backend (PM2, puerto 3001) para /api y /storage.
#
# Instalación en el VPS:
#   sudo cp deploy/nginx/skynetttn.conf /etc/nginx/sites-available/skynetttn.conf
#   sudo ln -s /etc/nginx/sites-available/skynetttn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d skynetttn.online -d www.skynetttn.online
# (certbot reescribe este archivo agregando el bloque 443/SSL automáticamente)

server {
    listen 80;
    listen [::]:80;
    server_name skynetttn.online www.skynetttn.online;

    # Build de producción del frontend (vite build → frontend/dist).
    # Ruta real en el VPS: repo bajo el usuario `prueba`, NO /var/www (eso es
    # de otro proyecto en este mismo servidor compartido — ver docs/despliegue).
    root /home/prueba/skynet/frontend/dist;
    index index.html;

    # Cabeceras de seguridad para TODO lo que sirve este bloque, incluido el
    # index.html/JS de la SPA que nginx entrega directo (helmet(), en
    # Backend/src/index.js, solo cubre las respuestas de /api y /storage que
    # pasan por Express — el documento HTML principal nunca las lleva si no
    # se declaran aquí también).
    #   * HSTS: certbot añade su propio bloque 443/SSL a este archivo (ver
    #     cabecera del archivo); este header queda igual disponible una vez
    #     ese bloque exista. preload requiere registrar el dominio en
    #     hstspreload.org — no se hace aquí, es una decisión aparte del
    #     equipo, no algo que se deba activar a ciegas.
    #   * CSP: permisiva en img-src/connect-src hacia Cloudinary (fotos/
    #     firmas/evidencias) y hacia el propio origen. style-src lleva
    #     'unsafe-inline' porque Tailwind y varias librerías de UI (Radix,
    #     framer-motion) inyectan estilos inline. script-src TAMBIÉN lleva
    #     'unsafe-inline' hoy: frontend/index.html tiene 2 <script> inline
    #     (aplicar tema antes del primer render, e iniciar/ocultar el splash)
    #     que se editan seguido — fijar su hash aquí sería un candado que se
    #     rompe en silencio (sin error visible, solo la consola del navegador)
    #     cada vez que alguien los toque sin acordarse de actualizar este
    #     archivo. Pendiente de verdad (ver docs/compliance/matriz-
    #     seguridad.md): mover esos 2 scripts a un archivo bajo /src para
    #     poder quitar 'unsafe-inline' sin ese riesgo.
    #     También pendiente de probar en vivo: el reconocimiento de voz
    #     offline (vosk-browser, frontend/src/escritorio/reconocedorVosk.js)
    #     usa WebAssembly — si alguna vez corre fuera del shell de Electron,
    #     puede necesitar 'wasm-unsafe-eval' en script-src.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # geolocation=(self): OrdenDetallePage.jsx la usa para registrar la
    # llegada a una OT de mantenimiento (lat/lng) — bloquearla del todo
    # rompería esa función.
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Gzip para el bundle JS/CSS servido como estático.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre (Vite): cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker y manifest de la PWA: nunca cachear, si no los clientes
    # tardan en recibir actualizaciones del SW.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # index.html referencia los bundles con hash del build actual (ver
    # /assets/ arriba): si el navegador lo cachea sin revalidar, un usuario
    # puede quedarse con un index.html que apunta a archivos que el
    # siguiente `npm run build` ya borró (pantalla en blanco) hasta que
    # fuerce un Ctrl+Shift+R. no-cache obliga a revalidar con el servidor
    # en cada carga (sigue siendo rápido: es un 304 si no cambió).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API del backend (Express en PM2, localhost:3001).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos servidos por el backend (PDFs legados, fotos que no van a Cloudinary).
    location /storage/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
    }

    # Actualizaciones de la app de escritorio (escritorio/src/actualizador.js).
    #
    # La app instalada en cada equipo pide latest.yml cada 6 horas; si dentro
    # hay una versión mayor que la suya, se descarga el .exe de esta misma
    # carpeta. Es el mismo mecanismo de electron-updater que usan VS Code o
    # Slack, servido desde aquí para no depender de GitHub ni de terceros.
    #
    # Los archivos NO viven dentro del repo, a propósito: un `git pull` o un
    # `npm run build` no deben poder borrar el instalador que los equipos están
    # descargando. Crear la carpeta una vez en el VPS:
    #   mkdir -p /home/prueba/skynet-descargas
    # `^~` para que gane a cualquier location con expresión regular y no se
    # cuele en el try_files de la SPA: un instalador que no existe debe dar 404,
    # no devolver el index.html de React (electron-updater intentaría parsear
    # HTML como YAML y el error sería incomprensible).
    location ^~ /descargas/ {
        alias /home/prueba/skynet-descargas/;

        # no-cache en TODA la carpeta, incluidos los .exe. Podrían cachearse
        # eternamente porque llevan la versión en el nombre, pero el archivo que
        # de verdad importa es latest.yml: si un proxy intermedio lo guarda, los
        # equipos siguen viendo la versión vieja horas después de publicar una
        # corrección. No merece la pena arriesgar eso para ahorrar un 304 en un
        # archivo que cada equipo baja una sola vez por versión.
        add_header Cache-Control "no-cache";

        # Sin índice de directorio: cada archivo se pide por su nombre exacto,
        # que el propio latest.yml indica.
        autoindex off;
    }

    # SPA: cualquier ruta que no sea archivo real cae en index.html
    # (React Router maneja el resto en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
