<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/claro.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#1f4d8f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TERMINAL DE NEIVA" />
    <title>TERMINAL DE NEIVA</title>
    <script>
      // Aplica el tema guardado ANTES del primer render de React.
      // Nuevo por defecto INSTITUCIONAL: claro. El oscuro solo se aplica si
      // el usuario lo eligió explícitamente (toggle persistido en AppLayout).
      if (localStorage.getItem('skynet-tema') === 'dark') {
        document.documentElement.classList.add('dark')
      }
    </script>
    <style>
      /* =========================================================
         SKYNET · SPLASH INSTITUCIONAL — Terminal de Transportes de Neiva
         - Paleta del logo: azul #1c568c, verde #5a982c, naranja #d96b12
           sobre lienzo claro #f4f7fb. Sin neón, sin glow, sin HUD.
         - Superficie sobria tipo documento: tarjeta blanca, sombra suave,
           filete azul superior, anillo tricolor del logo, retícula tenue.
         - GPU-friendly (transform/opacity). Respeta prefers-reduced-motion.
         ========================================================= */
      #skynet-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f4f7fb;
        background-image:
          linear-gradient(rgba(31, 77, 143, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(31, 77, 143, 0.05) 1px, transparent 1px);
        background-size: 44px 44px, 44px 44px;
        background-position: center, center;
        color: #17345e;
        contain: strict;
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }

      /* La clase "dark" ya está resuelta por el script de tema de arriba: si
         el usuario eligió el tema oscuro, el splash acompaña con un azul
         nocturno institucional (no negro táctico). */
      html.dark #skynet-splash {
        background-color: #0d1b33;
        background-image:
          linear-gradient(rgba(127, 164, 213, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(127, 164, 213, 0.06) 1px, transparent 1px);
        color: #d7e4f4;
      }

      #skynet-splash.skynet-splash-fadeout {
        opacity: 0;
        transform: scale(1.02) translate3d(0, 0, 0);
        visibility: hidden;
        pointer-events: none;
      }

      .skynet-splash-frame {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 88%;
        max-width: 380px;
        padding: 2.5rem 1.85rem 2rem;
        border: 1px solid rgba(23, 52, 94, 0.1);
        border-top: 3px solid #1f4d8f;
        border-radius: 10px;
        background: #ffffff;
        box-shadow: 0 18px 48px -20px rgba(21, 44, 79, 0.28),
                    0 4px 12px -6px rgba(21, 44, 79, 0.12);
        transform: translateZ(0);
      }

      html.dark .skynet-splash-frame {
        background: #142744;
        border-color: rgba(127, 164, 213, 0.16);
        border-top-color: #4e7cbe;
        box-shadow: 0 18px 48px -20px rgba(0, 0, 0, 0.6);
      }

      /* Esquinas institucionales discretas (no brackets tácticos) */
      .skynet-corner { display: none; }
      .skynet-scan-line { display: none; }

      /* Emblema: sello circular sobrio con el logo del Terminal */
      .skynet-holo-orb {
        position: relative;
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.15rem;
        transform: translateZ(0);
      }

      .skynet-halo-glow {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        background: rgba(31, 77, 143, 0.06);
        transform: translateZ(0);
        will-change: transform, opacity;
        animation: skynetPulseGpu 2.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .skynet-ring-outer {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(31, 77, 143, 0.14);
        border-top-color: #1f4d8f;
        transform: translateZ(0);
        will-change: transform;
        animation: skynetSpinGpu 2.4s cubic-bezier(0.55, 0.15, 0.4, 0.85) infinite;
      }

      html.dark .skynet-ring-outer {
        border-color: rgba(127, 164, 213, 0.18);
        border-top-color: #7fa4d5;
      }

      .skynet-ring-inner {
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: #5a982c;
        border-right-color: #d96b12;
        transform: translateZ(0);
        will-change: transform;
        animation: skynetSpinGpu 3.4s linear infinite reverse;
      }

      .skynet-core-badge {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #f4f7fb;
        border: 1px solid rgba(23, 52, 94, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateZ(0);
        padding: 6px;
        overflow: hidden;
      }

      html.dark .skynet-core-badge {
        background: #0d1b33;
        border-color: rgba(127, 164, 213, 0.22);
      }

      .skynet-core-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .skynet-brand-title {
        font-family: 'Plus Jakarta Sans', 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        text-transform: uppercase;
        margin: 0 0 0.3rem 0;
        color: #152c4f;
        text-align: center;
        white-space: nowrap;
      }

      html.dark .skynet-brand-title { color: #ffffff; }

      .skynet-tagline {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 0.625rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(23, 52, 94, 0.55);
        margin: 0 0 1.15rem 0;
      }

      html.dark .skynet-tagline { color: rgba(215, 228, 244, 0.6); }

      .skynet-progress-box { width: 100%; margin-bottom: 0.85rem; }

      .skynet-progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 0.4rem;
        color: rgba(23, 52, 94, 0.6);
      }

      html.dark .skynet-progress-header { color: rgba(215, 228, 244, 0.65); }

      .skynet-percent-text {
        font-variant-numeric: tabular-nums;
        color: #1f4d8f;
        font-weight: 700;
      }

      html.dark .skynet-percent-text { color: #7fa4d5; }

      .skynet-track {
        width: 100%;
        height: 5px;
        background: rgba(31, 77, 143, 0.1);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        transform: translateZ(0);
      }

      html.dark .skynet-track { background: rgba(127, 164, 213, 0.14); }

      .skynet-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #1c568c, #5a982c 55%, #d96b12);
        border-radius: 9999px;
        transform: translate3d(-100%, 0, 0);
        transition: transform 0.12s linear;
        will-change: transform;
      }

      .skynet-live-status {
        font-size: 0.6875rem;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        color: rgba(23, 52, 94, 0.7);
        letter-spacing: 0.08em;
        text-align: center;
        min-height: 1rem;
        margin: 0 0 0.9rem 0;
        text-transform: uppercase;
      }

      html.dark .skynet-live-status { color: rgba(215, 228, 244, 0.7); }

      .skynet-telemetry-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        width: 100%;
        border-top: 1px solid rgba(23, 52, 94, 0.1);
        padding-top: 0.85rem;
      }

      html.dark .skynet-telemetry-list { border-top-color: rgba(127, 164, 213, 0.16); }

      .skynet-telemetry-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.625rem;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.04em;
        color: rgba(23, 52, 94, 0.4);
        transition: color 0.25s ease;
      }

      html.dark .skynet-telemetry-item { color: rgba(215, 228, 244, 0.4); }

      .skynet-telemetry-item.active { color: #1f4d8f; }
      html.dark .skynet-telemetry-item.active { color: #7fa4d5; }
      .skynet-telemetry-item.done { color: #236b41; }
      html.dark .skynet-telemetry-item.done { color: #71bd8e; }

      .skynet-dot-pulse {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        margin-right: 6px;
      }

      @keyframes skynetSpinGpu {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes skynetPulseGpu {
        0%, 100% { transform: scale(0.96); opacity: 0.5; }
        50% { transform: scale(1.06); opacity: 0.9; }
      }

      @media (prefers-reduced-motion: reduce) {
        .skynet-ring-outer,
        .skynet-ring-inner,
        .skynet-halo-glow {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen Cinematográfico Inicial Optimizado para Móvil -->
    <div id="skynet-splash" aria-hidden="true">
      <div class="skynet-splash-frame">
        <div class="skynet-corner skynet-corner-tl"></div>
        <div class="skynet-corner skynet-corner-tr"></div>
        <div class="skynet-corner skynet-corner-bl"></div>
        <div class="skynet-corner skynet-corner-br"></div>
        <div class="skynet-scan-line"></div>

        <div class="skynet-holo-orb">
          <div class="skynet-halo-glow"></div>
          <div class="skynet-ring-outer"></div>
          <div class="skynet-ring-inner"></div>
          <div class="skynet-core-badge">
            <img src="/claro.png" alt="Terminal de Neiva Logo" class="skynet-core-logo" />
          </div>
        </div>

        <h1 class="skynet-brand-title">SKYNET</h1>
        <div class="skynet-tagline">Terminal de Transportes de Neiva</div>

        <div class="skynet-progress-box">
          <div class="skynet-progress-header">
            <span>INICIALIZANDO</span>
            <span id="skynet-splash-percent" class="skynet-percent-text">0%</span>
          </div>
          <div class="skynet-track">
            <div id="skynet-splash-bar-fill" class="skynet-fill"></div>
          </div>
        </div>

        <div id="skynet-splash-status" class="skynet-live-status">INICIALIZANDO NÚCLEO...</div>

        <div class="skynet-telemetry-list">
          <div id="telemetry-1" class="skynet-telemetry-item active">
            <span><span class="skynet-dot-pulse"></span>01 // NÚCLEO Y SEGURIDAD</span>
            <span class="status-tag">CARGANDO</span>
          </div>
          <div id="telemetry-2" class="skynet-telemetry-item">
            <span><span class="skynet-dot-pulse"></span>02 // BASE DE DATOS & API</span>
            <span class="status-tag">EN ESPERA</span>
          </div>
          <div id="telemetry-3" class="skynet-telemetry-item">
            <span><span class="skynet-dot-pulse"></span>03 // INTERFAZ DE USUARIO</span>
            <span class="status-tag">EN ESPERA</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Script de Telemetría Progresiva (0% a 100% fluido en 2.2 segundos) -->
    <script>
      (function() {
        var start = performance.now();
        var duration = 2100; // 2.1 segundos de secuencia de telemetría completa
        var percentEl = document.getElementById('skynet-splash-percent');
        var fillEl = document.getElementById('skynet-splash-bar-fill');
        var statusEl = document.getElementById('skynet-splash-status');
        var t1 = document.getElementById('telemetry-1');
        var t2 = document.getElementById('telemetry-2');
        var t3 = document.getElementById('telemetry-3');

        function step(now) {
          var elapsed = now - start;
          var progress = Math.min(elapsed / duration, 1);
          var eased = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;
          var percent = Math.round(eased * 100);

          if (percentEl) percentEl.textContent = percent + '%';
          if (fillEl) fillEl.style.transform = 'translate3d(' + (-100 + percent) + '%, 0, 0)';

          if (percent < 35) {
            if (statusEl) statusEl.textContent = 'INICIALIZANDO NÚCLEO...';
          } else if (percent < 70) {
            if (statusEl) statusEl.textContent = 'CONECTANDO SERVICIOS Y DATOS...';
            if (t1) { t1.className = 'skynet-telemetry-item done'; t1.querySelector('.status-tag').textContent = '[OK]'; }
            if (t2) { t2.className = 'skynet-telemetry-item active'; t2.querySelector('.status-tag').textContent = 'SINCRONIZANDO'; }
          } else if (percent < 98) {
            if (statusEl) statusEl.textContent = 'SINCRONIZANDO MÓDULOS...';
            if (t2) { t2.className = 'skynet-telemetry-item done'; t2.querySelector('.status-tag').textContent = '[OK]'; }
            if (t3) { t3.className = 'skynet-telemetry-item active'; t3.querySelector('.status-tag').textContent = 'MONTANDO'; }
          } else {
            if (statusEl) statusEl.textContent = 'SISTEMA ONLINE // LISTO';
            if (t3) { t3.className = 'skynet-telemetry-item done'; t3.querySelector('.status-tag').textContent = '[OK]'; }
          }

          if (progress < 1) {
            requestAnimationFrame(step);
          }
        }
        requestAnimationFrame(step);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
