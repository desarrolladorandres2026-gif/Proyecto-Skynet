<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skynet" />
    <title>Skynet</title>
    <script>
      // Aplica el tema guardado ANTES del primer render de React: sin esto,
      // la página siempre pinta primero con la paleta clara (nuevo default
      // de :root en panel.css) y recién cambia a oscura cuando AppLayout
      // monta y corre su efecto — un flash visible en cada carga para quien
      // eligió modo oscuro. Debe leer la misma clave que AppLayout.jsx
      // (TEMA_KEY = 'skynet-tema') y el mismo default (oscuro).
      if (localStorage.getItem('skynet-tema') !== 'light') {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
